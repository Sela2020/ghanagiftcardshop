<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Ghana Gift Card Shop</title>
<meta name="description" content="Create your Ghana Gift Card Shop account. Buy gift cards instantly with MoMo, Telecel Cash, AT Money or card.">
<meta name="theme-color" content="#0B0B0E">

<link rel="icon" type="image/png" href="images/ggcs-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="bg-grid-ambient" aria-hidden="true"></div>

<header id="siteHeader" class="site-header"></header>

<main id="main" data-page="register">

  <div class="container auth-page">
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-header">
        <div class="auth-header__mark" aria-hidden="true">GG</div>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-sub">One account for all your gift cards.</p>
      </div>

      <!-- Status message -->
      <div class="auth-alert" id="registerAlert" role="alert" hidden></div>

      <!-- Form -->
      <form class="auth-form" id="registerForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="regName">Full name</label>
          <input
            type="text"
            class="form-input"
            id="regName"
            name="name"
            placeholder="Kwame Mensah"
            autocomplete="name"
            required>
          <span class="form-error" id="regNameError" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email address</label>
          <input
            type="email"
            class="form-input"
            id="regEmail"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            inputmode="email"
            required>
          <span class="form-error" id="regEmailError" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              class="form-input"
              id="regPassword"
              name="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              minlength="8"
              required>
            <button
              type="button"
              class="password-toggle"
              data-password-toggle="regPassword"
              aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="form-error" id="regPasswordError" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirm">Confirm password</label>
          <div class="password-wrap">
            <input
              type="password"
              class="form-input"
              id="regConfirm"
              name="confirm"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required>
            <button
              type="button"
              class="password-toggle"
              data-password-toggle="regConfirm"
              aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="form-error" id="regConfirmError" role="alert"></span>
        </div>

        <label class="form-check">
          <input type="checkbox" id="regTerms" name="terms" required>
          <span>
            By signing up, you agree to our
            <a href="#" onclick="return false;">Terms and Conditions</a>
            and <a href="#" onclick="return false;">Privacy Policy</a>.
          </span>
        </label>

        <button type="submit" class="btn btn--primary btn--lg btn--block" id="regSubmit">
          Create account
        </button>

      </form>

      <!-- Google sign-in -->
      <div class="auth-divider" role="separator">or</div>

      <button type="button" class="google-btn" id="regGoogle">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
        </svg>
        <span>Sign up with Google</span>
      </button>

      <!-- Footer -->
      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
        <br>
        <a href="shop.html" class="auth-back">← Back to shop</a>
      </div>

    </div>
  </div>

</main>

<footer id="siteFooter" class="site-footer"></footer>

<script src="js/header.js"></script>
<script src="js/footer.js"></script>
<script src="js/main.js"></script>
<script src="js/products.js"></script>
<script src="js/register.js"></script>
<script src="js/router.js"></script>

</body>
</html>
